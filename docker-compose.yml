networks:
  terraform:
    enable_ipv6: true
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: 1

services:
  terraform:
    image: sinfallas/terraform-all-in-one:latest
    hostname: terraform
    container_name: terraform
    pull_policy: always
    restart: always
    ports:
      - 3000:3000
    environment:
      - AWS_ACCESS_KEY_ID=example
      - AWS_SECRET_ACCESS_KEY=example
      - AWS_DEFAULT_REGION=example
      - aws_vpc=vpc-XXXXXXXXX
      - aws_subnet=subnet-XXXXXXXX
      - rnombre=example
      - url=https://example.com
      - rtag=exampletag
      - rtoken=XXXXXXXXXXXXXXXX
      - ubuntupass=example
      - gitlabpass=example
      - nombreinstancia=example-example
      - nombregruposeguridad=example-sg
    volumes:
      - ./config.json:/etc/semaphore/config.json
      - ./semaphore_data:/app
      - ./recursos:/recursos
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - terraform
